name: Bug report
description: Something does not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting! Please fill in every required field: without them we usually cannot reproduce the problem.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem. What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: council
    attributes:
      label: Council details
      description: Who hosted the council (player, player's puppet or AI), whether the Head of Faith is a player or AI and attended, and what happened in the vote.
      placeholder: |
        Host: AI archbishop
        Head of Faith: AI Pope, attended
        Vote: majority in favour, proposal still passed
    validations:
      required: true

  - type: input
    id: game-version
    attributes:
      label: Game version
      description: Shown in the main menu.
      placeholder: "1.20.1.2"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Installed from
      options:
        - Steam Workshop
        - Manual (GitHub)
    validations:
      required: true

  - type: textarea
    id: dlcs-mods
    attributes:
      label: Active DLCs and full mod list (in load order)
    validations:
      required: true

  - type: dropdown
    id: only-this-mod
    attributes:
      label: Does it also happen with only Head of Faith Council Veto enabled?
      options:
        - "Yes"
        - "No"
        - Not tested
    validations:
      required: true

  - type: textarea
    id: error-log
    attributes:
      label: error.log
      description: |
        Drag and drop your error.log file into this box. It is overwritten every time the game starts: copy it right after the problem, before relaunching.
        Windows: Documents/Paradox Interactive/Crusader Kings III/logs/error.log
        Linux: ~/.local/share/Paradox Interactive/Crusader Kings III/logs/error.log
        macOS: ~/Documents/Paradox Interactive/Crusader Kings III/logs/error.log
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional, but very helpful for visual problems. Drag and drop images here.
